<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Favoritos | CineScope</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body data-page="favorites">
  <header class="dashboard-nav">
    <div class="dashboard-nav__inner">
      <a class="brand-mark" href="index.html"><span class="brand-mark__dot"></span>CineScope</a>
      <button type="button" class="dashboard-nav__toggle" data-nav-toggle aria-expanded="false"
        aria-controls="main-navigation" aria-label="Abrir navegacion">
        <span aria-hidden="true">&#9776;</span>
      </button>
      <nav id="main-navigation" class="dashboard-nav__menu" aria-label="Navegacion principal" data-nav-menu>
        <ul class="dashboard-nav__links">
          <li><a class="dashboard-nav__link" href="index.html">Resumen</a></li>
          <li><a class="dashboard-nav__link" href="catalog.html">Catalogo</a></li>
          <li><a class="dashboard-nav__link active" href="favorites.html" aria-current="page">Favoritos</a></li>
          <li><a class="dashboard-nav__link" href="team.html">Equipo</a></li>
        </ul>
        <span class="dashboard-nav__status"><span class="dashboard-nav__status-dot" aria-hidden="true"></span>Tu espacio de cine</span>
        <button type="button" class="theme-toggle" data-theme-toggle aria-pressed="false"
          aria-label="Cambiar a tema oscuro">
          <span class="theme-toggle__icon theme-toggle__icon--moon" aria-hidden="true">☀️</span>
          <span class="theme-toggle__thumb"></span>
          <span class="theme-toggle__icon theme-toggle__icon--sun" aria-hidden="true">🌙</span>
        </button>
      </nav>
  </header>
  <main class="library-page">
    <p class="eyebrow">TU SELECCIÓN PERSONAL</p>
    <h1>Favoritos</h1>
    <p class="page-intro">Guarda aquí las historias que quieres tener siempre a mano.</p>
    <p id="results-counter">0 resultados</p>
    <section id="catalog-container" class="catalog-grid" aria-live="polite"></section>
    <p id="empty-message" class="empty-library" hidden>No tienes favoritos todavía. Explora el catálogo y guarda una historia.</p>
  </main>
  <dialog id="details-modal" aria-labelledby="modal-title">
    <button id="close-modal" class="modal-close" type="button" aria-label="Cerrar detalles">&times;</button>
    <p class="eyebrow">DETALLES DEL TÍTULO</p>
    <h2 id="modal-title"></h2>
    <dl><dt>Director</dt><dd id="modal-director"></dd><dt>Reparto</dt><dd id="modal-elenco"></dd></dl>
    <p id="modal-sinopsis"></p>
  </dialog>
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
