<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo | CineScope</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <header class="site-header">
    <div class="site-header__bar">
      <a class="site-header__brand" href="index.html">CineScope</a>
      <button
        type="button"
        class="site-header__nav-toggle"
        data-nav-toggle
        aria-expanded="false"
        aria-controls="main-nav"
        aria-label="Abrir menu de navegacion"
      >
        <span aria-hidden="true">&#9776;</span>
      </button>
    </div>
    <nav id="main-nav" class="site-header__nav" data-nav-menu>
      <a href="index.html">Inicio</a>
      <a href="catalog.html">Catalogo</a>
      <a href="favorites.html">Favoritos</a>
      <a href="team.html">Equipo</a>
      <button
        type="button"
        class="theme-toggle"
        data-theme-toggle
        aria-pressed="false"
        aria-label="Cambiar a tema oscuro"
      >
        <span class="theme-toggle__icon theme-toggle__icon--moon" aria-hidden="true">☀️</span>
        <span class="theme-toggle__thumb"></span>
        <span class="theme-toggle__icon theme-toggle__icon--sun" aria-hidden="true">🌙</span>
      </button>
    </nav>
  </header>

  <main>
    <h1>Catalogo</h1>
    
    <!-- Aquí van tus tarjetas -->
    <div id="catalog-grid" class="catalog-grid"></div>
  
    <!-- Aquí va tu ventana modal -->
    <dialog id="details-modal" class="modal">
      <div class="modal-content">
        <button id="close-modal" class="btn-close" aria-label="Cerrar modal">&times;</button>
        <h2 id="modal-title">Título del contenido</h2>
        <div class="modal-body">
          <p><strong>Director:</strong> <span id="modal-director"></span></p>
          <p><strong>Elenco:</strong> <span id="modal-elenco"></span></p>
          <p><strong>Sinopsis:</strong> <span id="modal-sinopsis"></span></p>
        </div>
      </div>
    </dialog>
  </main>
  
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
